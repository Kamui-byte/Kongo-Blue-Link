version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: kongo_postgres
    environment:
      POSTGRES_USER: kongo_user
      POSTGRES_PASSWORD: kongo_password
      POSTGRES_DB: kongo_blue_link
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kongo_user -d kongo_blue_link"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kongo_network

  redis:
    image: redis:7-alpine
    container_name: kongo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kongo_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kongo_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kongo_user:kongo_password@postgresql:5432/kongo_blue_link
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "True"
      ENVIRONMENT: development
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - kongo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kongo_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kongo_network

volumes:
  postgres_data:
  redis_data:

networks:
  kongo_network:
    driver: bridge
